<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pinia-logger playground</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: #202124;
        background: #f8f9fa;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 16px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        color: #5f6368;
      }
      p:has(button) {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        background: #fff;
        color: #202124;
        cursor: pointer;
      }
      button:hover {
        background: #f1f3f4;
      }
      .console {
        min-height: 280px;
        border-radius: 8px;
      }
      .console:empty::before {
        content: "Click a button to see the logger output";
        display: block;
        padding: 12px;
        color: #9aa0a6;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
